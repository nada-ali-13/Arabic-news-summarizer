[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-news-summarizer"
version = "1.0.0"
description = "Khulasa: Arabic news summarization with fine-tuned AraT5v2"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Preserve authoritative handoff cell sources unchanged. Notebook schema and every
# code cell's syntax are checked by tests/test_notebooks.py; retain other lint rules.
[tool.ruff.lint.per-file-ignores]
"notebooks/Arabic_News_Training_1200.ipynb" = ["E402", "I001"]
"notebooks/Arabic_News_Evaluation.ipynb" = ["E401", "E402", "E701", "E702", "F401", "I001"]
"notebooks/Arabic_News_Gradio.ipynb" = ["I001"]

[tool.setuptools.package-data]
"arabic_summarizer.factcheck" = ["fixtures/*.json"]
